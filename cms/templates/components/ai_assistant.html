<aside id="ai-assistant" aria-label="AI Assistant">
  <button id="ai-assistant-toggle" type="button" aria-controls="ai-assistant-panel" aria-expanded="false">Need Help?</button>
  <div id="ai-assistant-panel" hidden>
    <!-- <h3>AI 助手 / AI Assistant / Pembantu AI</h3> -->
    <div id="ai-assistant-chat" role="log" aria-live="polite"></div>
    <div class="ai-assistant-ask">
      <label for="ai-assistant-input" class="sr-only">Input your question</label>
      <input id="ai-assistant-input" type="text" placeholder="What can I help you with?" />
      <button id="ai-assistant-send" type="button" aria-label="发送 / Send / Hantar" title="发送 / Send / Hantar">
        <span class="iconify ai-send-icon" data-icon="mdi:send" data-inline="false"></span>
      </button>
    </div>
  </div>
</aside>
