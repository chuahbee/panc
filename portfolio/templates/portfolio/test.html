<!DOCTYPE html>
<html>
<head>
    <title>Work Page Test</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Work Page Card</h1>
    <div id="card"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const pageId = params.get("id") || "7";

        axios.get(`/api/v2/pages/${pageId}/`)
            .then(response => {
                const data = response.data;
                const imageUrl = data.main_image?.url || "";
                const imageWidth = data.main_image?.width || "";
                const imageHeight = data.main_image?.height || "";
                const imageAlt = data.main_image?.alt || "";

                const imageBlock = imageUrl
                    ? `<img src="${imageUrl}" width="${imageWidth}" height="${imageHeight}" alt="${imageAlt}">`
                    : "";

                const card = `
                    <div style="border: 1px solid #ccc; padding: 10px; max-width: 400px;">
                        <h2>${data.title}</h2>
                        ${imageBlock}
                        <p><strong>Date:</strong> ${data.date || ""}</p>
                        <div>${data.body || ""}</div>
                    </div>
                `;

                document.getElementById('card').innerHTML = card;
            })
            .catch(error => {
                console.error(error);
            });
    </script>
</body>
</html>
